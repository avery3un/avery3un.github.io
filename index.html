<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avery Sun</title>
  <meta name="description" content="Avery Sun makes ideas click, stories stick, and little things matter.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">

  <!-- 字体：Inter（Light 300 / Regular 400 / Medium 500，含斜体）、Doto（左上角点阵 AS） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Inter:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═════════════ 左上角缩写 ═════════════ -->
  <header class="site-header">
    <a class="logo" href="about" data-route="about" aria-label="Avery Sun — home">AS</a>
  </header>

  <!-- ═════════════ 主标题（所有页面共用） ═════════════ -->
  <section class="hero">
    <h1 class="headline hand-pending" aria-label="Avery Sun makes ideas click, stories stick, and little things matter.">
      <span class="line">Avery Sun makes ideas <span class="anno anno-click">click</span><span class="sticker sticker-cursor" style="--tilt:-12deg; --d:.55s"><span class="sticker-body">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle class="cursor-ripple" cx="9" cy="6" r="6" fill="none" stroke="#4FB6C8" stroke-width="2.2"/>
              <path class="cursor-arrow" d="M9 5 L9 26 L14 21.2 L17.6 29 L21.4 27.3 L17.9 19.6 L24.6 19.6 Z" fill="#1c1c1c" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"/>
            </svg>
          </span></span>,</span>
      <span class="line"><span>stories</span><span class="sticker sticker-clapper" style="--tilt:9deg; --d:.7s"><span class="sticker-body">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <g class="clap-body">
                <rect x="5" y="17" width="30" height="18" rx="2.5" fill="#1c1c1c" stroke="#fff" stroke-width="3.5" paint-order="stroke"/>
                <path d="M8 17h4l3 5h-4zM17 17h4l3 5h-4zM26 17h4l3 5h-4z" fill="#fff"/>
                <path d="M10 27.5h20M10 31h12" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
              </g>
              <g class="clap-arm">
                <rect x="5" y="10" width="30" height="5.5" rx="1.5" fill="#1c1c1c" stroke="#fff" stroke-width="3.5" paint-order="stroke"/>
                <path d="M10 10h4.5l-3 5.5H7zM19 10h4.5l-3 5.5H16zM28 10h4.5l-3 5.5H25z" fill="#fff"/>
              </g>
            </svg>
          </span></span> <span class="anno anno-stick">stick<svg class="scribble scribble-circle" viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="draw" pathLength="1" style="--d:1s; --dur:.75s" d="M118 9 C160 8 196 24 193 50 C190 80 140 95 92 93 C42 91 6 74 8 47 C10 22 52 7 104 6 C128 5 150 9 166 17"/>
          </svg><img class="hand hand-circle" data-src="images/handwriting/hero-circle.png" alt="" style="--d:1s; --dur:.85s"></span>, and</span>
      <span class="line"><span class="nowrap"><span class="anno-little"><span class="anno-little-word">little things<svg class="scribble scribble-wave" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true">
              <path class="draw" pathLength="1" style="--d:1.65s; --dur:.7s; --ease:linear" d="M3 10 q5 -7 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0"/>
            </svg><img class="hand hand-wavy" data-src="images/handwriting/hero-wavy.png" alt="" style="--d:1.65s; --dur:.8s"></span><span class="note" aria-hidden="true">
            <span class="note-text">+ filmmaker · marketer · product builder</span><img class="hand hand-note" data-src="images/handwriting/hero-note.png" alt="" style="--d:2.35s; --dur:1.1s">
          </span></span><span class="sticker sticker-sparkle" style="--tilt:-8deg; --d:.85s"><span class="sticker-body">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <path class="spark-main" d="M18 5 C19.4 14 23 17.6 32 19 C23 20.4 19.4 24 18 33 C16.6 24 13 20.4 4 19 C13 17.6 16.6 14 18 5Z" fill="#FFC53D" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"/>
              <path class="spark-mini" d="M32 4 C32.5 7 33.6 8.1 36.5 8.6 C33.6 9.1 32.5 10.2 32 13.2 C31.5 10.2 30.4 9.1 27.5 8.6 C30.4 8.1 31.5 7 32 4Z" fill="#FF8FA3" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke"/>
              <circle class="spark-dot" cx="32" cy="31" r="2.4" fill="#4FB6C8" stroke="#fff" stroke-width="2" paint-order="stroke"/>
            </svg>
          </span></span></span> matter.</span>
    </h1>

    <p class="subtitle">A curious human who turns moments into stories</p>
  </section>

  <!-- ═════════════ 胶囊导航（滚动时吸顶） ═════════════ -->
  <div class="nav-sentinel" aria-hidden="true"></div>
  <nav class="nav-wrap" aria-label="Main">
    <div class="pill-nav">
      <span class="pill-indicator" aria-hidden="true"></span>
      <a href="work" data-route="work">work</a>
      <a href="play" data-route="play">play</a>
      <a href="about" data-route="about">about</a>
    </div>
  </nav>

  <!-- ═════════════ 内容区：点导航时只有这里会切换 ═════════════ -->
  <main id="view" class="view container" aria-live="polite"></main>


  <!-- ═════════════ 底部（所有页面共用） ═════════════ -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-name">Avery Sun</p>
      <div class="connect">
        <span class="connect-note">let's connect!</span><img class="hand-foot connect-img" data-src="images/handwriting/connect.png" alt="let's connect!" style="--d:.1s; --dur:.9s">
        <svg class="connect-arrow" viewBox="0 0 70 34" aria-hidden="true">
          <path class="draw" pathLength="1" style="--d:.1s; --dur:.5s" d="M4 22 C18 6 38 30 62 16"/>
          <path class="draw" pathLength="1" style="--d:.55s; --dur:.2s" d="M53 9 L63 15.5 L55 24"/>
        </svg><img class="hand-foot connect-arrow-img" data-src="images/handwriting/connect-arrow.png" alt="" style="--d:.9s; --dur:.5s">
        <ul class="pill-links">
          <li><a href="mailto:hao.sun@tufts.edu">Email</a></li>
          <li><a href="#" target="_blank" rel="noopener">LinkedIn</a></li>
          <li><a href="#" target="_blank" rel="noopener">Resume</a></li>
        </ul>
      </div>
    </div>
    <p class="copyright container">© <span id="year">2026</span> Avery Sun</p>
  </footer>


  <!-- ╔═══════════════════════════════════════════════════════════╗
       ║  页面内容都写在下面的 <template> 里                          ║
       ║  每个 template 对应一个页面：page-about / page-work / page-play ║
       ╚═══════════════════════════════════════════════════════════╝ -->

  <!-- ───── ABOUT ─────
       · 自我介绍：改 about-intro 里的两句话（电脑上一句一行）
       · 工作证：改 crew-pass 里的文字；签名图在 images/handwriting/signature.png；头像 avatar.png 放进 images/about/
       · 拍立得：照片 images/about/xxx.jpg；手写标签 images/handwriting/label-xxx.png（没有时显示斜体文字）
         --pos 控制方形裁切位置：50% 35% = 水平居中、偏上
         摆放位置和角度在 js/about.js 最上面
       · 便签：note.png 放进 images/about/ 就会替换占位文字 -->
  <template id="page-about">
    <section class="about">
      <div class="about-intro">
        <p>Hi, I'm Avery! I'm a creative who turns ideas into stories, experiences, and things that come to life.</p>
        <p>When I'm not creating, I'm bouldering, cooking or out with my camera.</p>
      </div>

      <div class="desk" data-desk>
        <button class="tidy-btn" type="button" data-tidy>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4M2.5 2.5v3h3"/></svg>
          tidy up
        </button>
        <div class="desk-backdrop" data-backdrop></div>

        <!-- 7 张拍立得（藏在工作证后面；最后一张是小时候的照片） -->
        <figure class="pol" data-pol style="--pos:50% 45%">
          <div class="pol-paper">
            <div class="pol-photo"><img src="images/about/bts.jpg" alt="On set, behind the camera" draggable="false"></div>
            <figcaption><span class="label-text">behind the camera</span><img class="swap-img label-img" data-src="images/handwriting/label-bts.png" alt="behind the camera" draggable="false"></figcaption>
          </div>
        </figure>
        <figure class="pol" data-pol style="--pos:50% 35%">
          <div class="pol-paper">
            <div class="pol-photo"><img src="images/about/climb.jpg" alt="Bouldering" draggable="false"></div>
            <figcaption><span class="label-text">the boulderer</span><img class="swap-img label-img" data-src="images/handwriting/label-climb.png" alt="the boulderer" draggable="false"></figcaption>
          </div>
        </figure>
        <figure class="pol" data-pol style="--pos:50% 50%">
          <div class="pol-paper">
            <div class="pol-photo"><img src="images/about/cook.jpg" alt="A home-cooked dinner" draggable="false"></div>
            <figcaption><span class="label-text">the home cook</span><img class="swap-img label-img" data-src="images/handwriting/label-cook.png" alt="the home cook" draggable="false"></figcaption>
          </div>
        </figure>
        <figure class="pol" data-pol style="--pos:50% 35%">
          <div class="pol-paper">
            <div class="pol-photo"><img src="images/about/travel.jpg" alt="Traveling" draggable="false"></div>
            <figcaption><span class="label-text">the traveler</span><img class="swap-img label-img" data-src="images/handwriting/label-travel.png" alt="the traveler" draggable="false"></figcaption>
          </div>
        </figure>
        <figure class="pol" data-pol style="--pos:50% 40%">
          <div class="pol-paper">
            <div class="pol-photo"><img src="images/about/nature.jpg" alt="Noticing little things in nature" draggable="false"></div>
            <figcaption><span class="label-text">the noticer</span><img class="swap-img label-img" data-src="images/handwriting/label-nature.png" alt="the noticer" draggable="false"></figcaption>
          </div>
        </figure>
        <figure class="pol" data-pol style="--pos:50% 40%">
          <div class="pol-paper">
            <div class="pol-photo"><img src="images/about/craft.jpg" alt="Group photo with the team" draggable="false"></div>
            <figcaption><span class="label-text">the team player</span><img class="swap-img label-img" data-src="images/handwriting/label-craft.png" alt="the team player" draggable="false"></figcaption>
          </div>
        </figure>

        <figure class="pol" data-pol style="--pos:50% 30%">
          <div class="pol-paper">
            <div class="pol-photo"><img src="images/about/kid.jpg" alt="Me as a kid, holding a slice of cake" draggable="false"></div>
            <figcaption><span class="label-text">little me</span><img class="swap-img label-img" data-src="images/handwriting/label-kid.png" alt="little me" draggable="false"></figcaption>
          </div>
        </figure>

        <!-- 工作证 + 便签 -->
        <div class="pass-wrap" data-pass>
          <article class="crew-pass" aria-label="Crew pass: Avery Sun">
            <span class="pass-hole" aria-hidden="true"></span>
            <div class="pass-photo"><img src="images/about/main.jpg" alt="Avery Sun" draggable="false"></div>
            <div class="pass-info">
              <p class="pass-title">CREW PASS</p>
              <div class="pass-name">
                <span class="pass-label">Name</span>
                <div class="pass-sign"><span class="sign-text">Avery Sun</span><img class="swap-img sign-img" data-src="images/handwriting/signature.png" alt="Avery Sun" draggable="false"></div>
              </div>
              <dl class="pass-list">
                <div><dt>School</dt><dd>Tufts University</dd></div>
                <div><dt>Major</dt><dd>Film &amp; Media · Psychology</dd></div>
                <div><dt>Minor</dt><dd>Entrepreneurship</dd></div>
              </dl>
            </div>
            <div class="pass-avatar"><span aria-hidden="true">🦖</span><img class="swap-img" data-src="images/about/avatar.png" alt="" draggable="false"></div>
          </article>

          <div class="sticky-note">
            <span class="sticky-text">every little piece makes me.</span><img class="swap-img" data-src="images/about/note.png" alt="every little piece makes me." draggable="false">
          </div>
        </div>
      </div>
    </section>
  </template>

  <!-- ───── WORK ───── -->
  <template id="page-work">
    <section class="coming-soon">
      <p class="cs-title">coming soon</p>
      <p class="cs-sub">Selected projects are on their way. Check back shortly!</p>
    </section>
  </template>

  <!-- ───── PLAY ─────
       三张卡片的内容都在 data/ 文件夹里改：
       · 歌：data/music.js   · 电影：data/movies.js   · 朋友：data/friends.js
       （卡片里只放内容，不放说明文字） -->
  <template id="page-play">
    <section class="play" data-play>

      <figure class="play-item">
        <div class="play-card cf" data-music tabindex="0" aria-label="On repeat"></div>
      </figure>

      <figure class="play-item">
        <div class="play-card reel-card" data-movies></div>
      </figure>

      <figure class="play-item">
        <div class="play-card stk-card" data-friends></div>
      </figure>

    </section>
  </template>

  <script src="data/music.js"></script>
  <script src="data/movies.js"></script>
  <script src="data/friends.js"></script>
  <script src="js/about.js"></script>
  <script src="js/play.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
